name: Publish

# Release flow: push a tag `v<version>` (e.g. v0.2.0). One tag releases every
# ecosystem, which is safe because scripts/check_versions.py already refuses a
# build whose manifests disagree — there is only ever one ccharts version.
#
#   PyPI    sdist + cibuildwheel wheels        PYPI_API_TOKEN
#   crates  cargo publish                      CARGO_REGISTRY_TOKEN
#   npm     npm publish (with provenance)      NPM_TOKEN
#   NuGet   dotnet nuget push                  NUGET_API_KEY
#   Maven   mvn deploy via the Central Portal  MAVEN_CENTRAL_USERNAME,
#                                              MAVEN_CENTRAL_PASSWORD,
#                                              MAVEN_GPG_PRIVATE_KEY,
#                                              MAVEN_GPG_PASSPHRASE
#
# The Go module is not published to a registry; it is served from the tag, so
# the last job pushes the `bindings/go/v<version>` tag Go requires for a module
# in a subdirectory.
#
# The C# and Java packages carry prebuilt native libraries, built by
# natives.yml and arranged by scripts/pack_natives.py.
#
# `workflow_dispatch` runs every build job without uploading anything, so a
# release can be rehearsed in full.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check the tag matches every manifest
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify version consistency
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )"
          echo "tag version:       ${tag_version}"
          echo "pyproject version: ${pyproject_version}"
          if [ "${tag_version}" != "${pyproject_version}" ]; then
            echo "::error::Tag version '${tag_version}' does not match pyproject version '${pyproject_version}'"
            exit 1
          fi

      # Cargo.toml, package.json, the csproj, the pom and the ABI header all
      # carry the version too; a release must not go out with them disagreeing.
      - name: Verify every manifest carries the same version
        run: python3 scripts/check_versions.py

  sdist:
    name: Build sdist
    needs: check-version
    # Runs on tags (when the check passes) and on manual dispatch (when the
    # check job is skipped); never runs after a failed version check.
    if: needs.check-version.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/

  wheels:
    name: Build wheels (${{ matrix.os }})
    needs: check-version
    if: needs.check-version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Cache cibuildwheel's downloaded CPython build/test tools and pip
      # caches. Non-existent paths on a given OS are ignored.
      - uses: actions/cache@v6
        id: cibw-cache
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cibuildwheel
            ~/Library/Caches/pip
            ~/Library/Caches/cibuildwheel
            %LocalAppData%\pip\Cache
            %LocalAppData%\cibuildwheel
          key: cibuildwheel-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('pyproject.toml', 'setup.py', 'ccharts/wrapper.c') }}

      - name: Build wheels (CPython 3.9-3.14)
        uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  # Prebuilt shared libraries for the two bindings that link rather than
  # compile: C# and Java.
  natives:
    name: Native libraries
    needs: check-version
    if: needs.check-version.result != 'failure'
    uses: ./.github/workflows/natives.yml

  publish-crates:
    name: Publish the Rust crate
    needs: check-version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Compiles the crate exactly as it will be consumed, from the packaged
      # files only — which is what catches a missing vendored C source.
      - run: cargo publish --dry-run
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish the npm package
    needs: check-version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: bindings/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      # The WebAssembly module is committed, so this needs no emscripten; the
      # test suite is what proves the committed .wasm is not stale.
      - run: node --test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-nuget:
    name: Publish the NuGet package
    needs: [check-version, natives]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: natives

      - name: Arrange the native libraries
        run: |
          python3 scripts/pack_natives.py --artifacts natives
          python3 scripts/pack_natives.py --artifacts natives --check

      - name: Pack
        run: dotnet pack bindings/dotnet/src/Ccharts/Ccharts.csproj -c Release -o nupkg

      # A package that silently lost its natives would still install and then
      # fail at the first call, so check before it leaves the runner.
      - name: The package carries every runtime
        run: |
          set -euo pipefail
          contents="$(unzip -l nupkg/*.nupkg)"
          for rid in linux-x64 osx-arm64 win-x64; do
            echo "${contents}" | grep -q "runtimes/${rid}/native/" || {
              echo "::error::nupkg is missing runtimes/${rid}/native/"
              exit 1
            }
          done

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-maven:
    name: Publish to Maven Central
    needs: [check-version, natives]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          # java.lang.foreign is final in 22; 25 is the current LTS.
          java-version: "25"
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: natives

      - name: Arrange the native libraries
        run: |
          python3 scripts/pack_natives.py --artifacts natives
          python3 scripts/pack_natives.py --artifacts natives --check

      - name: The jar carries every platform
        working-directory: bindings/java
        run: |
          set -euo pipefail
          mvn -B -DskipTests package
          contents="$(unzip -l target/ccharts-*.jar)"
          for platform in linux-x86_64 macos-aarch64 windows-x86_64; do
            echo "${contents}" | grep -q "native/${platform}/" || {
              echo "::error::jar is missing native/${platform}/"
              exit 1
            }
          done

      - name: Deploy
        working-directory: bindings/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease -DskipTests deploy

  # Go modules are served from the repository, but a module in a subdirectory
  # needs a tag carrying that prefix. Creating it here keeps it from being the
  # one manual step in an otherwise automated release.
  tag-go-module:
    name: Tag the Go module
    needs: check-version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push bindings/go/${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="bindings/go/${GITHUB_REF_NAME}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null 2>&1; then
            echo "${tag} already exists"
            exit 0
          fi
          git tag "${tag}" "${GITHUB_REF_NAME}"
          git push origin "${tag}"

  publish:
    name: Upload to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ccharts
    permissions:
      id-token: write # only needed if you later switch to trusted publishing
      contents: read
    steps:
      # Merges the sdist artifact and all three wheel artifacts into dist/.
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verify-metadata: true
          # Alternative: trusted publishing (no token) once the "pypi"
          # environment is wired up in PyPI -> Publishing settings:
          #   https://docs.pypi.org/trusted-publishers/
          # Then drop `password` and keep the id-token: write permission.