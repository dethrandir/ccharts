name: Publish

# Release flow: push a tag `v<version>` (e.g. v0.2.0). The workflow verifies
# the tag against pyproject.toml, then builds the sdist and the
# manylinux/macOS/Windows wheels (CPython 3.9-3.14 via cibuildwheel) and
# uploads everything to PyPI with the PYPI_API_TOKEN secret.
#
# `workflow_dispatch` runs the same build jobs without uploading, so a
# release can be smoke-tested without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check tag matches pyproject version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version consistency
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version="$(python - <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          EOF
          )"
          echo "tag version:       ${tag_version}"
          echo "pyproject version: ${pyproject_version}"
          if [ "${tag_version}" != "${pyproject_version}" ]; then
            echo "::error::Tag version '${tag_version}' does not match pyproject version '${pyproject_version}'"
            exit 1
          fi

  sdist:
    name: Build sdist
    needs: check-version
    # Runs on tags (when the check passes) and on manual dispatch (when the
    # check job is skipped); never runs after a failed version check.
    if: needs.check-version.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/

  wheels:
    name: Build wheels (${{ matrix.os }})
    needs: check-version
    if: needs.check-version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache cibuildwheel's downloaded CPython build/test tools and pip
      # caches. Non-existent paths on a given OS are ignored.
      - uses: actions/cache@v4
        id: cibw-cache
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cibuildwheel
            ~/Library/Caches/pip
            ~/Library/Caches/cibuildwheel
            %LocalAppData%\pip\Cache
            %LocalAppData%\cibuildwheel
          key: cibuildwheel-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('pyproject.toml', 'setup.py', 'ccharts/wrapper.c') }}

      - name: Build wheels (CPython 3.9-3.14)
        uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish:
    name: Upload to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ccharts
    permissions:
      id-token: write # only needed if you later switch to trusted publishing
      contents: read
    steps:
      # Merges the sdist artifact and all three wheel artifacts into dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          verify-metadata: true
          # Alternative: trusted publishing (no token) once the "pypi"
          # environment is wired up in PyPI -> Publishing settings:
          #   https://docs.pypi.org/trusted-publishers/
          # Then drop `password` and keep the id-token: write permission.