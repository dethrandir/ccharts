name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Full build+test on one latest-Python runner: warning-free C compile,
  # the C demo, and the Python unit suite against an editable install.
  test:
    name: Build & test (gcc -Wall / make / unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile with gcc -Wall (0 warnings expected)
        run: |
          gcc -Wall -c ccharts/wrapper.c $(python3-config --includes) -o /tmp/wrapper.o
          gcc -Wall main.c -lm -o /tmp/ccharts_demo

      - name: make test (C demo)
        run: make test

      # The pandas extra is installed here only. The matrix job and the
      # cibuildwheel wheel tests run without it, which also proves the
      # pandas tests skip cleanly when pandas is absent.
      - name: Build extension and run unit tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[pandas]"
          python3 -m unittest discover -s tests -v

  # The flat C ABI every non-Python binding links against. Builds it with
  # CMake, runs the C-level smoke test, and enforces the two drift guards:
  # the rendered output must still match conformance/golden, and the vendored
  # source copies must match the originals.
  abi:
    name: C ABI (cmake / ctest / conformance)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile the ABI with -Wall -Wextra -pedantic (0 warnings expected)
        if: runner.os != 'Windows'
        run: |
          gcc -Wall -Wextra -Werror -std=c99 -pedantic -I. -Iabi \
              -c abi/ccharts_abi.c -o /tmp/ccharts_abi.o

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Smoke test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Only the ABI symbols are exported
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          exported="$(nm -D --defined-only build/libccharts_abi.so | grep -c ' T ')"
          echo "exported symbols: ${exported}"
          test "${exported}" -eq 14
          ! nm -D --defined-only build/libccharts_abi.so | grep -q ' T cc_'

      - name: Conformance goldens are current
        run: python3 scripts/gen_golden.py --check

      - name: Vendored sources are current
        run: python3 scripts/sync_sources.py --check

      - name: Version is consistent across manifests
        run: python3 scripts/check_versions.py

  # Rust binding: compiles the vendored ABI with the cc crate, so no system
  # library is involved. Runs on all three platforms because build.rs has an
  # MSVC-specific path (/utf-8).
  rust:
    name: Rust binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Go binding: cgo builds the vendored sources from the package directory.
  # CGO_ENABLED=0 is unsupported by design and not tested.
  go:
    name: Go binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.21"
          # The module has no dependencies, so there is no go.sum for the
          # default cache to key on and it warns on every run.
          cache: false
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt needed for: ${unformatted}"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  # JavaScript binding: the WebAssembly module is checked in, so this needs
  # nothing but Node. If the C sources change without src/wasm-binary.js being
  # rebuilt, the conformance test fails against the regenerated goldens —
  # which is the drift guard for the committed .wasm.
  js:
    name: JavaScript binding (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    defaults:
      run:
        working-directory: bindings/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # C# and Java both link the shared library from the CMake build rather than
  # compiling the C themselves, so both jobs build it first and point at it
  # with CCHARTS_NATIVE_DIR.
  dotnet:
    name: .NET binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build the native library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Test
        env:
          CCHARTS_NATIVE_DIR: ${{ github.workspace }}/build
        run: dotnet test bindings/dotnet/tests/Ccharts.Tests/Ccharts.Tests.csproj

  java:
    name: Java binding (FFM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          # java.lang.foreign is final in 22; 25 is the current LTS.
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Build the native library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Test
        working-directory: bindings/java
        env:
          CCHARTS_NATIVE_DIR: ${{ github.workspace }}/build
        run: mvn -B test

  # The extension must compile and pass under every supported CPython.
  test-matrix:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install and run unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m unittest tests.test_python_api -v