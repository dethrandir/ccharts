name: Publish Maven Central only

# Publish just the Java package to Maven Central, independently of the full
# tag-based release (which opens every registry at once). Useful while the
# other manifests' publish steps are still being stood up, and as a smoke test.
#
# Builds the native libraries via natives.yml (reused), arranges them into the
# jar, and deploys through the Sonatype Central Portal plugin already wired
# into the pom (autoPublish + waitUntil=published).
#
# Run it from the Actions tab (Run workflow) or:
#   gh workflow run publish-maven.yml
#
# Requires: a verified io.github.dethrandir namespace on Central Portal, a
# published GPG signing key, and the repo secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
#   MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natives:
    uses: ./.github/workflows/natives.yml

  publish-maven:
    name: Publish to Maven Central
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          # java.lang.foreign is final in 22; 25 is the current LTS.
          java-version: "25"
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: natives

      - name: Arrange the native libraries
        run: |
          python3 scripts/pack_natives.py --artifacts natives
          python3 scripts/pack_natives.py --artifacts natives --check

      - name: The jar carries every platform
        working-directory: bindings/java
        run: |
          set -euo pipefail
          mvn -B -DskipTests package
          contents="$(unzip -l target/ccharts-*.jar)"
          for platform in linux-x86_64 macos-aarch64 windows-x86_64; do
            echo "${contents}" | grep -q "native/${platform}/" || {
              echo "::error::jar is missing native/${platform}/"
              exit 1
            }
          done

      - name: Deploy
        working-directory: bindings/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -Prelease -DskipTests deploy