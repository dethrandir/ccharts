[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ccharts"
version = "0.2.0"
description = "Terminal charts for financial OHLC data (line and candlestick)"
readme = "README.md"
requires-python = ">=3.9"
# SPDX license expression (PEP 639). Requires setuptools>=77.
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dethrandir" },
]
keywords = [
    "chart",
    "candlestick",
    "ohlc",
    "terminal",
    "cli",
    "financial",
    "ascii",
    "trading",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Terminals",
]

[project.urls]
Homepage = "https://github.com/dethrandir/ccharts"
Repository = "https://github.com/dethrandir/ccharts"
Documentation = "https://github.com/dethrandir/ccharts"
Bugs = "https://github.com/dethrandir/ccharts/issues"

# Explicit package list: the C sources are compiled by setup.py, so the wheel
# carries only __init__.py + the compiled extension; the sdist carries the
# sources via MANIFEST.in.
[tool.setuptools]
packages = ["ccharts"]

# cibuildwheel (CI only). Build CPython 3.9-3.14 for the archs below and run
# the unit suite against each built wheel. `cp314-*` already excludes the
# free-threaded 3.14 builds (`cp314t-*`); an explicit `!cp314t-*` token is
# invalid selector syntax and is intentionally omitted.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
test-command = "python -m unittest discover -s {project}/tests -v"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]  # Windows uses AMD64; x86_64 is invalid there.